[package]
name = "orbit"
version = "0.2.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "=0.8.23", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Storage", "HtmlTextAreaElement", "HtmlInputElement", "File", "FileList", "Blob", "HtmlVideoElement", "HtmlMediaElement", "MediaQueryList"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
base64 = "0.22.1"
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
