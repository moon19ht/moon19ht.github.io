[package]
name = "orbit"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
leptos = { version = "=0.8.23", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
web-sys = { version = "0.3", features = ["Window", "Storage", "HtmlTextAreaElement", "HtmlInputElement"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
